name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Synopio.slnx --locked-mode

      - name: Check formatting
        run: dotnet format Synopio.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build Synopio.slnx --no-restore -c Release -p:TreatWarningsAsErrors=true -p:EnforceCodeStyleInBuild=true

      - name: Test
        run: dotnet test --project Synopio.Engine.Tests --no-build -c Release

      - name: Check third-party licenses
        shell: pwsh
        run: ./scripts/ThirdPartyLicenses.ps1
