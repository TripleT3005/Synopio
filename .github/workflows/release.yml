name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - installer/**
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::Directory.Build.props has no version"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exists=false
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            exists=true
          fi
          if [ "$exists" = false ] && awk '/^## \[Unreleased\]/ { found = 1; next } /^## \[/ { found = 0 } found && NF' CHANGELOG.md | grep -q .; then
            echo "::error::CHANGELOG.md still has entries under [Unreleased]; move them into the section for ${{ steps.version.outputs.version }}"
            exit 1
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.exists == 'false' || github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Synopio.slnx --locked-mode

      - name: Test
        run: dotnet test --project Synopio.Engine.Tests -c Release

      - name: Publish
        run: dotnet publish Synopio/Synopio.csproj --no-restore -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -o publish

      - name: Collect third-party licenses
        shell: pwsh
        run: ./scripts/ThirdPartyLicenses.ps1 -Output THIRD-PARTY-LICENSES.txt

      - name: Package
        shell: bash
        run: |
          name="Synopio-${{ needs.version.outputs.version }}-windows-x64"
          mkdir -p "dist/$name"
          cp publish/Synopio.exe "dist/$name/"
          cp -R publish/lang "dist/$name/lang"
          cp LICENSE THIRD-PARTY-LICENSES.txt README.md "dist/$name/"
          cd dist
          7z a -tzip -bso0 "$name.zip" "$name"
          sha256sum "$name.zip" > "$name.zip.sha256"

      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress -y
          }
          & $compiler /Qp "/DAppVersion=$env:VERSION" installer\Synopio.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location dist
          $setup = "Synopio-$env:VERSION-windows-x64-setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$setup" | Out-File -Encoding ascii -NoNewline "$setup.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: [version, build]
    if: github.event_name != 'pull_request' && needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/changelog.md"
          if [ ! -s "$RUNNER_TEMP/changelog.md" ]; then
            echo "::error::CHANGELOG.md has no text for version $VERSION"
            exit 1
          fi

          cd dist
          prerelease=""
          case "$VERSION" in 0.*|*-*) prerelease="--prerelease" ;; esac

          gh release create "$TAG" ./* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/changelog.md" \
            $prerelease

          if [ -z "$VT_API_KEY" ]; then
            echo "::warning::The repository secret VT_API_KEY is not set, so the release has no VirusTotal scan"
            exit 0
          fi

          {
            gh release view "$TAG" --repo "${{ github.repository }}" --json body -q .body
            echo
            echo "---"
            echo
            echo "### VirusTotal Scan Report"
            echo "Scanned on: $(date -u +%Y-%m-%d)"
            echo
            for archive in *.zip *.exe; do
              [ -e "$archive" ] || continue
              curl --fail --silent --show-error \
                --header "x-apikey: $VT_API_KEY" \
                --form "file=@$archive" \
                https://www.virustotal.com/api/v3/files > /dev/null
              hash=$(cut -d ' ' -f 1 "$archive.sha256")
              echo "- **$archive:** [Scan Report](https://www.virustotal.com/gui/file/$hash)"
            done
          } > notes.md

          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file notes.md

  discord:
    needs: [version, release]
    uses: TripleT3005/TripleT3005/.github/workflows/discord-release.yml@main
    with:
      title: Synopio ${{ needs.version.outputs.version }}
      version: ${{ needs.version.outputs.version }}
      tag: v${{ needs.version.outputs.version }}
      changelog: CHANGELOG.md
      page: synopio
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
